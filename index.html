<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Point your camera at a QR code to see every section highlighted and explained — finder patterns, timing patterns, data, error correction, and more." />

  <title>QR Visualizer — see inside a QR code</title>
  <meta name="application-name" content="QR Visualizer" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header>
    <a href="index.html" class="brand" style="text-decoration:none; color:inherit;">
      <span class="logo" aria-hidden="true">
        <!-- 7×7 stylized finder pattern logo -->
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        <span></span><span class="off"></span><span class="off"></span><span class="off"></span><span class="off"></span><span class="off"></span><span></span>
        <span></span><span class="off"></span><span></span><span></span><span></span><span class="off"></span><span></span>
        <span></span><span class="off"></span><span></span><span></span><span></span><span class="off"></span><span></span>
        <span></span><span class="off"></span><span></span><span></span><span></span><span class="off"></span><span></span>
        <span></span><span class="off"></span><span class="off"></span><span class="off"></span><span class="off"></span><span class="off"></span><span></span>
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </span>
      QR Visualizer
    </a>
    <nav>
      <a href="index.html" class="active">Scan</a>
      <a href="learn.html">Learn</a>
    </nav>
  </header>

  <main>
    <div class="viewport">
      <video id="video" playsinline muted></video>
      <canvas id="capture"></canvas>
      <canvas id="overlay"></canvas>
      <div class="reticle" aria-hidden="true"></div>
      <div id="status">Loading camera…</div>
      <div id="zoom-controls" hidden>
        <button id="zoom-out" type="button" class="zoom-btn" aria-label="Zoom out">−</button>
        <span id="zoom-readout">1×</span>
        <button id="zoom-in" type="button" class="zoom-btn" aria-label="Zoom in">+</button>
      </div>
      <button id="legend-btn" type="button" aria-label="Toggle color legend" aria-expanded="false">Legend</button>
      <div id="legend" role="region" aria-label="Color legend">
        <button id="legend-close" type="button" aria-label="Close legend">×</button>
        <div class="legend-item"><span class="legend-swatch" style="background:#f43f5e"></span>Finder pattern</div>
        <div class="legend-item"><span class="legend-swatch" style="background:#fbbf24"></span>Separator</div>
        <div class="legend-item"><span class="legend-swatch" style="background:#22c55e"></span>Timing pattern</div>
        <div class="legend-item"><span class="legend-swatch" style="background:#3b82f6"></span>Alignment pattern</div>
        <div class="legend-item"><span class="legend-swatch" style="background:#a855f7"></span>Format info</div>
        <div class="legend-item"><span class="legend-swatch" style="background:#ec4899"></span>Version info</div>
        <div class="legend-item"><span class="legend-swatch" style="background:#0ea5e9"></span>Dark module</div>
        <div class="legend-item"><span class="legend-swatch" style="background:#94a3b8"></span>Data + ECC</div>
      </div>
      <section id="summary" class="summary-drawer" hidden aria-expanded="false">
        <button id="summary-toggle" type="button" class="summary-handle" aria-label="Expand details">
          <span class="summary-peek"></span>
          <span class="summary-chevron" aria-hidden="true">⌃</span>
        </button>
        <div id="summary-rows" class="summary-rows"></div>
      </section>
    </div>

    <div class="controls">
      <label for="file-input" class="btn icon-btn" aria-label="Upload image" title="Upload an image">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
      </label>
      <input id="file-input" type="file" accept="image/*" capture="environment" hidden />
      <button id="freeze-btn" type="button" class="btn icon-btn" aria-pressed="false" aria-label="Freeze frame" title="Freeze">
        <svg id="freeze-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>
      </button>
      <button id="readpath-btn" type="button" class="btn" aria-pressed="false" title="Show the order modules are read">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"></path><path d="M7 14l4-4 4 4 5-5"></path></svg>
        Read path
      </button>
      <button id="info-btn" type="button" class="btn" aria-pressed="false" title="Show decoded details">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        Info
      </button>
      <button id="resume" type="button" class="btn primary" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
        Camera
      </button>
    </div>
  </main>

  <footer class="site-footer">
    <span>Open source on GitHub —</span>
    <a href="https://github.com/mncoleman/qr-visualizer" target="_blank" rel="noopener noreferrer">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55 0-.27-.01-.99-.02-1.94-3.2.69-3.87-1.54-3.87-1.54-.52-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.78 1.19 1.78 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.04 0 0 .97-.31 3.18 1.18.92-.26 1.91-.39 2.89-.39.98 0 1.97.13 2.89.39 2.21-1.49 3.18-1.18 3.18-1.18.63 1.58.23 2.75.11 3.04.74.81 1.19 1.84 1.19 3.1 0 4.43-2.7 5.41-5.27 5.7.41.36.78 1.06.78 2.14 0 1.55-.01 2.8-.01 3.18 0 .31.21.67.8.55C20.21 21.38 23.5 17.08 23.5 12 23.5 5.65 18.35.5 12 .5z"/></svg>
      mncoleman/qr-visualizer
    </a>
  </footer>

  <aside id="sheet" class="sheet" role="dialog" aria-modal="false" aria-labelledby="sheet-title">
    <div class="sheet-grab" aria-hidden="true"></div>
    <button id="sheet-close" class="sheet-close" aria-label="Close">×</button>
    <h2 id="sheet-title"></h2>
    <p id="sheet-short" class="short"></p>
    <p id="sheet-body" class="body"></p>
    <p style="margin: 4px 0 0;"><a href="learn.html" class="link">Read the full guide →</a></p>
  </aside>

  <script src="js/jsQR.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
